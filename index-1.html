<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#facc15">
<title>Vitrine Açailândia</title>
<style>
:root{--yellow:#facc15;--ink:#171717;--muted:#666;--bg:#f6f6f3;--white:#fff;--line:#e7e7e2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--yellow);padding:22px 16px 18px;border-bottom:4px solid #171717}.head{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:3px solid #171717;border-radius:12px;display:grid;place-items:center;background:#fff;font-size:25px}.brand h1{font-size:clamp(22px,4vw,32px);margin:0;font-weight:900;letter-spacing:-.7px}.brand p{margin:2px 0 0;font-size:13px;font-weight:600}.wrap{max-width:1100px;margin:auto;padding:18px 16px 44px}.intro{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}.intro h2{margin:0;font-size:23px}.intro p{margin:5px 0 0;color:var(--muted);font-size:14px}.btn{border:0;border-radius:10px;background:#171717;color:white;padding:12px 16px;font-weight:800;cursor:pointer}.btn.yellow{background:var(--yellow);color:#171717;border:2px solid #171717}.filters{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}.search,.select,input,textarea{width:100%;padding:12px;border:1px solid #d8d8d2;border-radius:10px;background:white;font:inherit}.categories{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.chip{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;font-weight:650}.chip.active{background:#171717;color:#fff;border-color:#171717}.status{font-size:13px;color:var(--muted);margin:6px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;display:flex;flex-direction:column}.photo{height:155px;background:#ededeb;display:grid;place-items:center;color:#777;font-size:42px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:12px;display:flex;flex-direction:column;gap:7px;flex:1}.tag{font-size:11px;font-weight:800;text-transform:uppercase;color:#5d5d5d;letter-spacing:.4px}.info h3{margin:0;font-size:16px;line-height:1.25;overflow-wrap:anywhere}.price{font-size:21px;font-weight:900}.desc{font-size:13px;color:#666;white-space:pre-wrap;overflow-wrap:anywhere}.seller{font-size:12px;color:#555}.contact{display:block;text-align:center;background:#20b95a;color:#fff;text-decoration:none;border-radius:9px;padding:10px;font-weight:800;margin-top:auto}.empty{background:white;border:1px dashed #ccc;border-radius:14px;padding:28px;text-align:center;color:#666;grid-column:1/-1}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.open{display:flex}.panel{background:#fff;border-radius:18px;padding:20px;width:min(600px,100%);max-height:92vh;overflow:auto}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel h2{margin:0}.close{border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:22px;cursor:pointer}.formgrid{display:grid;gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field small{color:#777}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.danger{background:#fff;color:#a00;border:1px solid #e5bcbc}.foot{text-align:center;font-size:12px;color:#777;margin-top:28px}@media(min-width:650px){.filters{grid-template-columns:1fr 240px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:190px}.modal{align-items:center}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head>
<body>
<header><div class="head"><div class="logo">🛍️</div><div class="brand"><h1>Vitrine Açailândia</h1><p>Compre e venda na sua cidade</p></div></div></header>
<main class="wrap"><section class="intro"><div><h2>Encontre o que você procura</h2><p>Anúncios locais, direto com o vendedor.</p></div><button class="btn yellow" id="openForm">＋ Anunciar produto</button></section>
<div class="filters"><input class="search" id="search" placeholder="Buscar produto..." aria-label="Buscar produto"><select class="select" id="sort"><option value="recent">Mais recentes</option><option value="low">Menor preço</option><option value="high">Maior preço</option></select></div>
<div class="categories" id="categories"></div><div class="status" id="status"></div><section class="grid" id="products"></section><p class="foot">Vitrine Açailândia • Classificados locais</p></main>
<div class="modal" id="modal"><div class="panel"><div class="panelhead"><h2 id="formTitle">Anunciar produto</h2><button class="close" id="closeForm" aria-label="Fechar">×</button></div><form id="productForm"><div class="formgrid">
<div class="field"><label for="name">Nome do produto *</label><input id="name" required maxlength="80" placeholder="Ex.: Bicicleta aro 29"></div>
<div class="two"><div class="field"><label for="price">Valor (R$) *</label><input id="price" type="number" min="0" step="0.01" required placeholder="250,00"></div><div class="field"><label for="category">Categoria *</label><select id="category" required><option value="">Escolha...</option></select></div></div>
<div class="field"><label for="seller">Nome do vendedor *</label><input id="seller" required maxlength="60" placeholder="Seu nome"></div>
<div class="field"><label for="phone">WhatsApp/telefone *</label><input id="phone" required inputmode="tel" placeholder="(99) 99999-9999"></div>
<div class="field"><label for="description">Descrição</label><textarea id="description" rows="3" maxlength="500" placeholder="Estado do produto, detalhes, local de entrega..."></textarea></div>
<div class="field"><label for="photo">Foto do produto</label><input id="photo" type="file" accept="image/*"><small>Escolha uma foto do celular ou computador. Use imagens leves.</small><div id="photoPreview"></div></div>
</div><div class="actions"><button class="btn" type="button" id="cancelForm">Cancelar</button><button class="btn yellow" type="submit">Publicar anúncio</button></div></form></div></div>
<script>
const CATS=['Todos','Eletrônicos','Celulares','Casa e móveis','Veículos','Imóveis','Moda','Beleza','Esportes e lazer','Serviços','Outros'];
const $=id=>document.getElementById(id);let selected='Todos',photoData='',editingId=null;
const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function getItems(){try{return JSON.parse(localStorage.getItem('vitrineAcaailandiaProducts')||'[]')}catch{return []}}
function saveItems(items){try{localStorage.setItem('vitrineAcaailandiaProducts',JSON.stringify(items));return true}catch(e){alert('Não foi possível salvar. A foto pode ser muito grande; tente uma imagem menor.');return false}}
function cleanPhone(s){return s.replace(/\D/g,'')}
function renderCats(){ $('categories').innerHTML='';CATS.forEach(c=>{const b=document.createElement('button');b.className='chip'+(selected===c?' active':'');b.textContent=c;b.onclick=()=>{selected=c;renderCats();render()};$('categories').appendChild(b)});$('category').innerHTML='<option value="">Escolha...</option>'+CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}
function render(){let items=getItems(),q=$('search').value.trim().toLocaleLowerCase('pt-BR');items=items.filter(p=>(selected==='Todos'||p.category===selected)&&(`${p.name} ${p.description||''} ${p.seller} ${p.category}`).toLocaleLowerCase('pt-BR').includes(q));if($('sort').value==='low')items.sort((a,b)=>a.price-b.price);else if($('sort').value==='high')items.sort((a,b)=>b.price-a.price);else items.sort((a,b)=>b.created-a.created);$('status').textContent=`${items.length} ${items.length===1?'anúncio encontrado':'anúncios encontrados'}`;const root=$('products');root.innerHTML='';if(!items.length){root.innerHTML='<div class="empty"><div style="font-size:34px">🔎</div><strong>Nenhum anúncio encontrado</strong><p>Seja o primeiro a anunciar um produto!</p><button class="btn yellow" onclick="openForm()">＋ Anunciar produto</button></div>';return}items.forEach(p=>{const card=document.createElement('article');card.className='product';const photo=document.createElement('div');photo.className='photo';if(p.photo){const im=document.createElement('img');im.src=p.photo;im.alt=p.name;photo.appendChild(im)}else photo.textContent='📦';const info=document.createElement('div');info.className='info';info.innerHTML=`<div class="tag">${esc(p.category)}</div><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><div class="desc">${esc(p.description||'')}</div><div class="seller">Vendedor: ${esc(p.seller)}</div>`;const link=document.createElement('a');link.className='contact';const number=cleanPhone(p.phone);link.href='https://wa.me/'+(number.length<=11?'55':'')+number+'?text='+encodeURIComponent(`Olá, vi seu anúncio de ${p.name} na Vitrine Açailândia. Ainda está disponível?`);link.target='_blank';link.rel='noopener';link.textContent='Conversar com vendedor';info.appendChild(link);const tools=document.createElement('div');tools.style.cssText='display:flex;gap:8px;padding:0 12px 12px';const edit=document.createElement('button');edit.className='chip';edit.textContent='Editar';edit.onclick=()=>openForm(p.id);const del=document.createElement('button');del.className='chip';del.textContent='Excluir';del.onclick=()=>{if(confirm('Excluir este anúncio deste aparelho?')){saveItems(getItems().filter(x=>x.id!==p.id));render()}};tools.append(edit,del);card.append(photo,info,tools);root.appendChild(card)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(id=null){editingId=id;photoData='';$('productForm').reset();$('photoPreview').innerHTML='';$('formTitle').textContent=id?'Editar anúncio':'Anunciar produto';if(id){const p=getItems().find(x=>x.id===id);if(p){$('name').value=p.name;$('price').value=p.price;$('category').value=p.category;$('seller').value=p.seller;$('phone').value=p.phone;$('description').value=p.description||'';photoData=p.photo||'';if(photoData)$('photoPreview').innerHTML='<img style="max-width:130px;max-height:100px;margin-top:8px;border-radius:8px" src="'+photoData+'" alt="Prévia da foto">'}}$('modal').classList.add('open')}
function closeForm(){$('modal').classList.remove('open');editingId=null;photoData=''}
$('openForm').onclick=()=>openForm();$('closeForm').onclick=closeForm;$('cancelForm').onclick=closeForm;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});$('search').oninput=render;$('sort').onchange=render;
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Escolha um arquivo de imagem.');return}if(f.size>3*1024*1024){alert('A foto precisa ter até 3 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{photoData=r.result;$('photoPreview').innerHTML='<img style="max-width:130px;max-height:100px;margin-top:8px;border-radius:8px" src="'+photoData+'" alt="Prévia da foto">'};r.readAsDataURL(f)};
$('productForm').onsubmit=e=>{e.preventDefault();const items=getItems();const old=editingId?items.find(x=>x.id===editingId):null;const p={id:editingId||String(Date.now()),name:$('name').value.trim(),price:Number($('price').value),category:$('category').value,seller:$('seller').value.trim(),phone:$('phone').value.trim(),description:$('description').value.trim(),photo:photoData||(old&&old.photo)||'',created:old?old.created:Date.now()};if(!p.name||!p.category||!p.seller||!p.phone||!Number.isFinite(p.price)||p.price<0){alert('Confira os campos obrigatórios.');return}const next=editingId?items.map(x=>x.id===editingId?p:x):[p,...items];if(saveItems(next)){closeForm();render()}};
renderCats();render();window.openForm=openForm;
</script></body></html>
